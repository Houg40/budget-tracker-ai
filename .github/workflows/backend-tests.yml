name: Backend Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Not real credentials - database.py and auth.py require these to be
      # set at import time, but the test suite overrides the DB session with
      # an in-memory SQLite database and never actually connects to Postgres
      # or issues a JWT that needs to survive past this run.
      DATABASE_URL: postgresql://ci:ci@localhost/ci_unused
      JWT_SECRET_KEY: ci-only-placeholder-secret-not-used-in-production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v
